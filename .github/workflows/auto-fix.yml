name: Auto Fix — AI CI Failure Repair

on:
  repository_dispatch:
    types: [ai-auto-fix]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 페이로드 확인
        run: |
          echo "failure_id: ${{ github.event.client_payload.failure_id }}"
          echo "failure_type: ${{ github.event.client_payload.failure_type }}"
          echo "branch: ${{ github.event.client_payload.branch }}"
          echo "run_id: ${{ github.event.client_payload.run_id }}"

      - name: .NET 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: psycopg2 설치 (job_lock 의존성)
        run: pip install psycopg2-binary -q

      - name: Job Lock Claim (fail-open)
        env:
          SDLC_DB_CONNECTION: ${{ secrets.SDLC_DB_CONNECTION }}
        run: |
          BRANCH="${{ github.event.client_payload.branch }}"
          LOCK_OUTPUT=$(python .github/scripts/job_lock.py claim \
            --branch "${BRANCH}" \
            --agent-id "n8n" \
            --ttl 30 2>&1)
          LOCK_EXIT=$?
          echo "$LOCK_OUTPUT"
          if [ "$LOCK_EXIT" -eq 3 ]; then
            echo "⚠️ SDLC DB 연결 불가 — lock 없이 진행합니다 (fail-open)"
          elif [ "$LOCK_EXIT" -eq 1 ]; then
            echo "⛔ 다른 agent가 이미 작업 중입니다 — auto-fix 중단"
            exit 1
          elif [ "$LOCK_EXIT" -eq 2 ]; then
            echo "⚠️ DB에 job 없음 — lock 없이 진행합니다"
          else
            LOCK_TOKEN=$(echo "$LOCK_OUTPUT" | grep '^LOCK_TOKEN=' | cut -d= -f2)
            echo "LOCK_TOKEN=${LOCK_TOKEN}" >> $GITHUB_ENV
          fi

      - name: 모델 선택 (failure_type 기반)
        run: |
          FAILURE_TYPE="${{ github.event.client_payload.failure_type }}"
          case "$FAILURE_TYPE" in
            FORMAT)
              MODEL="claude-haiku-4-5-20251001"
              ;;
            BUILD|TEST)
              MODEL="claude-sonnet-4-6"
              ;;
            *)
              MODEL="claude-sonnet-4-6"
              ;;
          esac
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "Selected model: $MODEL (failure_type=$FAILURE_TYPE)"

      - name: /qa-failure 자동 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_TYPE: ${{ github.event.client_payload.failure_type }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          SDLC_DB_CONNECTION: ${{ secrets.SDLC_DB_CONNECTION }}
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          claude --model "${MODEL}" --dangerously-skip-permissions -p "/qa-failure --run-id ${RUN_ID}"

      - name: Job Lock Release
        if: always()
        env:
          SDLC_DB_CONNECTION: ${{ secrets.SDLC_DB_CONNECTION }}
        run: |
          BRANCH="${{ github.event.client_payload.branch }}"
          if [ -n "$LOCK_TOKEN" ]; then
            python .github/scripts/job_lock.py release \
              --branch "${BRANCH}" \
              --token "${LOCK_TOKEN}" 2>/dev/null || \
              echo "lock release 실패 — TTL 만료 후 자동 해제됩니다 (30분 이내)"
          fi
