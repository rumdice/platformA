name: CI — Build & Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PlatformA/PlatformA.sln

      - name: Build
        run: dotnet build PlatformA/PlatformA.sln --no-restore --configuration Release

      - name: Format check (whitespace)
        run: dotnet format PlatformA/PlatformA.sln whitespace --verify-no-changes --no-restore

      - name: Format check (style)
        run: dotnet format PlatformA/PlatformA.sln style --verify-no-changes --no-restore

      - name: Test
        run: |
          dotnet test PlatformA/PlatformA.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
