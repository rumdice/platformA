name: Auto-fix dotnet format

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]

jobs:
  auto-format:
    name: Auto-fix format on CI failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch != 'main' }}

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PlatformA/PlatformA.sln

      - name: Run dotnet format
        id: format
        run: |
          dotnet format PlatformA/PlatformA.sln whitespace --no-restore
          dotnet format PlatformA/PlatformA.sln style --no-restore
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only
          fi

      - name: Commit and push format fixes
        if: steps.format.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore[ci]: auto-fix dotnet format (whitespace/style)"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}

      - name: No format changes needed
        if: steps.format.outputs.changed == 'false'
        run: echo "Format is already correct. CI failure was not format-related."
