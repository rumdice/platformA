name: Docs → GitHub Pages

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect .NET version from csproj
        id: dotnet-ver
        run: |
          VERSION=$(grep -rh '<TargetFramework>' PlatformA --include='*.csproj' \
            | grep -oP 'net\K[\d.]+' | sort -V | tail -1)
          echo "version=${VERSION}.x" >> "$GITHUB_OUTPUT"
          echo "Detected .NET SDK: ${VERSION}.x"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet-ver.outputs.version }}

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore .NET packages
        run: dotnet restore PlatformA/PlatformA.sln

      - name: Generate doc metadata (version + test count)
        run: python .github/scripts/generate_doc_meta.py

      - name: Generate proto packet docs
        run: python .github/scripts/generate_proto_docs.py

      - name: Generate Redis keyspace docs
        run: python .github/scripts/generate_redis_key_docs.py

      - name: Generate API-guide docs
        run: python .github/scripts/generate_api_docs.py

      - name: Generate DB schema doc
        run: python .github/scripts/generate_db_schema.py

      - name: Build DocFX site
        run: docfx Docs/docfx.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Docs/_site
          force_orphan: true
