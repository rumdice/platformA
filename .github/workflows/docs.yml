name: Docs → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Docs/**"
      - "PlatformA/**/*.cs"
      - "PlatformA/PlatformA.MySqlDB.Lib/**"
      - "PlatformA/PlatformA.Game.Server/**"
      - ".github/scripts/generate_api_docs.py"
      - ".github/scripts/generate_db_schema.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore .NET packages
        run: dotnet restore PlatformA/PlatformA.sln

      - name: Generate API-guide docs
        run: python .github/scripts/generate_api_docs.py

      - name: Generate DB schema doc
        run: python .github/scripts/generate_db_schema.py

      - name: Build DocFX site
        run: docfx Docs/docfx.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Docs/_site
          force_orphan: true
