name: Plan File Trigger — Auto Workflow

on:
  push:
    branches: ['**']
    paths:
      - '.claude/plan/*.md'

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 미처리 계획 파일 탐지
        id: detect
        run: |
          PLAN_FILE=$(ls .claude/plan/*.md 2>/dev/null | grep -v "processed" | sort | tail -1 || echo "")
          if [ -z "$PLAN_FILE" ]; then
            echo "No unprocessed plan file found — skipping."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "plan_file=$PLAN_FILE" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Detected plan file: $PLAN_FILE"

      - name: .NET 설치
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Node.js 설치
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI 설치
        if: steps.detect.outputs.found == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 계획 파일 위험도 파싱 및 모델 선택
        if: steps.detect.outputs.found == 'true'
        run: |
          PLAN_FILE="${{ steps.detect.outputs.plan_file }}"
          RISK=$(head -10 "$PLAN_FILE" | grep -i "^risk:" | head -1 | cut -d: -f2 | tr -d ' ' | tr '[:lower:]' '[:upper:]' || echo "")
          case "$RISK" in
            LOW)
              MODEL="claude-haiku-4-5-20251001"
              ;;
            HIGH)
              MODEL="claude-opus-4-8"
              ;;
            *)
              MODEL="claude-sonnet-4-6"
              ;;
          esac
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          echo "Selected model: $MODEL (risk=$RISK)"

      - name: /workflow 자동 실행
        if: steps.detect.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          claude --model "${MODEL}" --dangerously-skip-permissions -p "/workflow"
