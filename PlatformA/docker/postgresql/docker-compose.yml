# PlatformA — PostgreSQL 16 (독립 실행용)
#
# 목적: AI_SDLC 상태 저장소로 사용하는 PostgreSQL을 독립적으로 실행한다.
#       전체 스택은 docker-compose.full.yml 을 사용한다.
#
# 시작:   docker compose -f docker/postgresql/docker-compose.yml up -d
# 종료:   docker compose -f docker/postgresql/docker-compose.yml down
# 초기화: docker compose -f docker/postgresql/docker-compose.yml down -v
#
# 접근:   psql -h localhost -p 5432 -U platforma -d platforma_sdlc

networks:
  postgresql-net:
    driver: bridge

volumes:
  sdlc-postgres-data:

services:
  postgres:
    image: postgres:16
    container_name: platforma-sdlc-postgres
    restart: always
    environment:
      POSTGRES_DB: platforma_sdlc
      POSTGRES_USER: platforma
      POSTGRES_PASSWORD: platforma_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sdlc-postgres-data:/var/lib/postgresql/data
    networks:
      - postgresql-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platforma -d platforma_sdlc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SDLC DB Migrator (일회성: EF Core 마이그레이션 자동 적용) ─────────────────
  sdlc-db-migrator:
    build:
      context: ../..
      dockerfile: PlatformA.SdlcDB.Lib/Dockerfile.migrator
    container_name: sdlc-db-migrator
    restart: "no"
    environment:
      SDLC_DB_CONNECTION: "Host=postgres;Port=5432;Database=platforma_sdlc;Username=platforma;Password=platforma_dev_password"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgresql-net
