# PlatformA — 통합 Docker Compose (HTTPS 전용)
#
# 목적: 로컬 컨테이너 환경에서 전체 스택을 실행하여 K8s 배포를 검증한다.
#       API 서비스는 HTTPS 전용으로 동작하며, 인증서는 볼륨 마운트로 주입한다.
#
# ── 최초 실행 전 필수: 개발 인증서 내보내기 ────────────────────────────────
#   PowerShell:
#     dotnet dev-certs https --export-path ./docker/certs/devcert.pfx --password "localdev"
#   이후 docker-compose 가 /https/devcert.pfx 를 각 컨테이너에 마운트한다.
#
# 시작:   docker-compose -f docker/docker-compose.full.yml up -d --build
# 종료:   docker-compose -f docker/docker-compose.full.yml down
# 초기화: docker-compose -f docker/docker-compose.full.yml down -v
#
# 호스트에서 DummyClient를 로컬 실행할 경우 환경변수 설정:
#   AUTH_API_URL=https://localhost:7001/api/Auth/login
#   AUTH_API_REFRESH_URL=https://localhost:7001/api/Auth/refresh
#   TICKET_API_URL=https://localhost:7003
#   MATCH_API_URL=https://localhost:7002/api/GameMatch/RequestMatch
#   MATCH_HUB_URL=https://localhost:7002/hubs/matching
#   GAME_SERVER_IP=127.0.0.1
#   REDIS_CONNECTION_STRING=127.0.0.1:6381,127.0.0.1:6382,127.0.0.1:6383

networks:
  platformA-net:
    driver: bridge

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
  mariadb-data:

services:

  # ── Redis Cluster (3 Master + 3 Slave) ──────────────────────────────────────
  # 각 노드는 독립 컨테이너로 platformA-net 내의 고유 IP를 가진다.
  # --cluster-announce-hostname 으로 서비스 이름을 자기 주소로 알려
  # StackExchange.Redis 가 MOVED 리다이렉트를 컨테이너명으로 해석할 수 있게 한다.
  # (Redis 7.0+ 기능)

  redis-node-1:
    image: redis:latest
    container_name: redis-node-1
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6381:6379"
    volumes:
      - redis-node-1-data:/data
    networks:
      - platformA-net

  redis-node-2:
    image: redis:latest
    container_name: redis-node-2
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-2
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6382:6379"
    volumes:
      - redis-node-2-data:/data
    networks:
      - platformA-net

  redis-node-3:
    image: redis:latest
    container_name: redis-node-3
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-3
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6383:6379"
    volumes:
      - redis-node-3-data:/data
    networks:
      - platformA-net

  redis-node-4:
    image: redis:latest
    container_name: redis-node-4
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-4
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    volumes:
      - redis-node-4-data:/data
    networks:
      - platformA-net

  redis-node-5:
    image: redis:latest
    container_name: redis-node-5
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-5
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    volumes:
      - redis-node-5-data:/data
    networks:
      - platformA-net

  redis-node-6:
    image: redis:latest
    container_name: redis-node-6
    restart: always
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-6
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    volumes:
      - redis-node-6-data:/data
    networks:
      - platformA-net

  redis-cluster-init:
    image: redis:latest
    container_name: redis-cluster-init
    restart: "no"
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: >
      sh -c "
        echo 'Waiting for Redis nodes...' &&
        sleep 5 &&
        echo 'yes' | redis-cli --cluster create
        redis-node-1:6379
        redis-node-2:6379
        redis-node-3:6379
        redis-node-4:6379
        redis-node-5:6379
        redis-node-6:6379
        --cluster-replicas 1
      "
    networks:
      - platformA-net

  # ── MariaDB ─────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:latest
    container_name: mariadb-full
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: pass1234
    ports:
      - "13306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - platformA-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth.API (HTTPS:7001) ────────────────────────────────────────────────────
  auth-api:
    build:
      context: ..
      dockerfile: PlatformA.Auth.API/Dockerfile
    container_name: auth-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JWT_SECRET: "YourSuperSecretKeyForPlatformAMSA!@#123"
      REDIS_CONNECTION_STRING: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379"
      MYSQL_WEBAPP_CONNECTION_STRING: "Server=mariadb;Port=3306;Database=db_WebApp;User=root;Password=pass1234"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "localdev"
    ports:
      - "7001:7001"
    volumes:
      - ./certs:/https:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - platformA-net

  # ── Matching.API (HTTPS:7002) ────────────────────────────────────────────────
  matching-api:
    build:
      context: ..
      dockerfile: PlatformA.Matching.API/Dockerfile
    container_name: matching-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JWT_SECRET: "YourSuperSecretKeyForPlatformAMSA!@#123"
      REDIS_CONNECTION_STRING: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379"
      MYSQL_WEBAPP_CONNECTION_STRING: "Server=mariadb;Port=3306;Database=db_WebApp;User=root;Password=pass1234"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "localdev"
    ports:
      - "7002:7002"
    volumes:
      - ./certs:/https:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - platformA-net

  # ── Ticketing.API (HTTPS:7003) ───────────────────────────────────────────────
  ticketing-api:
    build:
      context: ..
      dockerfile: PlatformA.Ticketing.API/Dockerfile
    container_name: ticketing-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JWT_SECRET: "YourSuperSecretKeyForPlatformAMSA!@#123"
      REDIS_CONNECTION_STRING: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379"
      QUEUE_BASE_RATE: "50"
      QUEUE_MAX_RATE: "500"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "localdev"
    ports:
      - "7003:7003"
    volumes:
      - ./certs:/https:ro
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - platformA-net

  # ── Utils.API (HTTPS:7004) ───────────────────────────────────────────────────
  utils-api:
    build:
      context: ..
      dockerfile: PlatformA.Utils.API/Dockerfile
    container_name: utils-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      REDIS_CONNECTION_STRING: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379"
      SNOWFLAKE_WORKER_ID: "1"
      SNOWFLAKE_DATACENTER_ID: "1"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "localdev"
    ports:
      - "7004:7004"
    volumes:
      - ./certs:/https:ro
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - platformA-net

  # ── Game.Server (TCP:7777) ───────────────────────────────────────────────────
  game-server:
    build:
      context: ..
      dockerfile: PlatformA.Game.Server/Dockerfile
    container_name: game-server
    restart: always
    environment:
      REDIS_CONNECTION_STRING: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379"
      GAME_SERVER_IP: "game-server"
      GAME_SERVER_PORT: "7777"
    ports:
      - "7777:7777"
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - platformA-net
