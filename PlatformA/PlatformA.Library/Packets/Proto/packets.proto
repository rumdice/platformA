syntax = "proto3";

option csharp_namespace = "PlatformA.Library.Packets";

enum LoginResultCode
{
    LOGIN_SUCCESS = 0;
    LOGIN_INVALID_TOKEN = 1;
    LOGIN_NOT_IN_QUEUE = 2;
    LOGIN_DUPLICATE = 3;
    LOGIN_ROOM_NOT_FOUND = 4;
}

enum EnterRoomResultCode
{
    ENTER_ROOM_SUCCESS = 0;
    ENTER_ROOM_NOT_FOUND = 1;
}

// C_Move (PacketID = 1) — Client → Server: 이동 요청
message CMove
{
    float x = 1;
    float y = 2;
    float z = 3;
}

// S_Move (PacketID = 2) — Server → Client: 이동 브로드캐스트
message SMove
{
    int32 player_id = 1;
    float x = 2;
    float y = 3;
    float z = 4;
}

// C_Login (PacketID = 3) — Client → Server: 로그인 요청
message CLogin
{
    int32 room_id = 1;
    string jwt_token = 2;
}

// S_Login (PacketID = 4) — Server → Client: 로그인 결과
message SLogin
{
    LoginResultCode result_code = 1;
    int32 player_id = 2;
}

// C_EnterRoom (PacketID = 5) — Client → Server: 방 이동 요청
message CEnterRoom
{
    int32 room_id = 1;
}

// S_EnterRoom (PacketID = 6) — Server → Client: 방 이동 결과
message SEnterRoom
{
    EnterRoomResultCode result_code = 1;
    int32 room_id = 2;
}

// ── Gomoku (오목) 전용 패킷 ──────────────────────────────────────────────────

enum StoneColor
{
    STONE_NONE  = 0;
    STONE_BLACK = 1;
    STONE_WHITE = 2;
}

enum GameOverReason
{
    FIVE_IN_ROW = 0;
    TIMEOUT     = 1;
    DISCONNECT  = 2;
    DRAW        = 3;
}

// C_PlaceStone — Client → Server: 돌 놓기 요청
message CPlaceStone
{
    int32 x = 1;
    int32 y = 2;
}

// S_BoardUpdate — Server → Client: 돌 놓기 결과 브로드캐스트
message SBoardUpdate
{
    int32      x                    = 1;
    int32      y                    = 2;
    StoneColor color                = 3;
    int32      next_turn_player_id  = 4;
}

// S_GameStart — Server → Client: 게임 시작 (선후 공개)
message SGameStart
{
    int32 player1_id           = 1;
    int32 player2_id           = 2;
    int32 first_turn_player_id = 3;
}

// S_GameOver — Server → Client: 게임 종료
message SGameOver
{
    int32          winner_id = 1;
    GameOverReason reason    = 2;
    string         lobby_url = 3;  // 종료 후 클라이언트가 복귀할 SignalR Lobby URL
}

// ── Lobby 전용 패킷 ──────────────────────────────────────────────────────────

enum MatchRequestResultCode
{
    MATCH_QUEUED    = 0;
    MATCH_FOUND     = 1;
    MATCH_FAILED    = 2;
    MATCH_CANCELLED = 3;
}

// C_MatchRequest — Client → Lobby: 매칭 요청
message CMatchRequest
{
    string game_type = 1;  // "gomoku", "cartrider" 등
}

// S_MatchFound — Lobby → Client: 매칭 성사 및 게임 서버 접속 정보 전달
message SMatchFound
{
    MatchRequestResultCode result_code = 1;
    string host    = 2;
    int32  port    = 3;
    string room_id = 4;
}

// Packet — 모든 메시지를 감싸는 envelope. oneof field tag 가 packetId 역할을 대체한다.
message Packet
{
    oneof payload
    {
        CMove        c_move         = 1;
        SMove        s_move         = 2;
        CLogin       c_login        = 3;
        SLogin       s_login        = 4;
        CEnterRoom   c_enter_room   = 5;
        SEnterRoom   s_enter_room   = 6;
        CPlaceStone  c_place_stone  = 7;
        SBoardUpdate s_board_update = 8;
        SGameStart   s_game_start   = 9;
        SGameOver    s_game_over    = 10;
        CMatchRequest c_match_request = 11;
        SMatchFound   s_match_found   = 12;
    }
}
